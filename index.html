#intro.on{display:flex;flex-direction:column;align-items:center;gap:26px;padding:120px 20px 40px;text-align:center}
#intro::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,50,90,.42),rgba(20,50,90,0) 55%)}
#intro>*{position:relative}
#intro h1{font-family:"Noto Sans KR",sans-serif;font-weight:900;font-size:45.2px;margin:0;color:#fff;letter-spacing:-.02em;text-shadow:0 2px 14px rgba(20,50,90,.55)}
.go{font:700 17px "Noto Sans KR",sans-serif;background:#fff;color:#2f7fc4;border:0;border-radius:999px;padding:14px 34px;cursor:pointer;box-shadow:0 4px 16px rgba(20,50,90,.3)}
.go:hover{filter:brightness(.96)}
.go:focus-visible,textarea:focus-visible,input[type=text]:focus-visible,.slot:focus-within{outline:3px solid var(--head);outline-offset:2px}

.wrap{padding:28px 8px 40px}
h2.top{font-family:"Noto Sans KR",sans-serif;font-weight:900;text-align:center;color:var(--title);font-size:31.4px;margin:0 0 28px;letter-spacing:-.02em}
.row{display:grid;gap:7px;margin-bottom:7px}
.r3{grid-template-columns:repeat(3,1fr)}.r2{grid-template-columns:repeat(2,1fr)}
.card{min-width:0;display:flex;flex-direction:column;border-radius:17.3px;overflow:hidden;background:var(--card)}
.card>h3{margin:0;background:var(--head);color:#fff;text-align:center;font:900 12.2px/1.3 "Noto Sans KR",sans-serif;padding:9.4px 6px}
.card>h3 small{font-size:.72em;opacity:.9}
.body{flex:1;padding:8.6px;display:flex;flex-direction:column;gap:8px}
.slot{position:relative;display:block;aspect-ratio:4/3;border-radius:9.4px;background:var(--slot);cursor:pointer;overflow:hidden}
.slot input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:1}
.slot .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;color:var(--muted);font-size:11.4px;line-height:1.5}
.slot .pic{position:absolute;inset:0;background-size:cover;background-position:center}
.slot.has .ph{display:none}
.rm{display:none;position:absolute;top:6px;right:6px;z-index:2;width:26px;height:26px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.slot.has .rm{display:block}
textarea,input.own,.ta{display:block;width:100%;border:0;background:var(--slot);color:var(--ink);border-radius:9.4px;text-align:center;font:400 13.0px/1.6 "Noto Sans KR",sans-serif}
textarea,.ta{flex:1 1 0;height:0;min-height:0;padding:12px;resize:none}
.short{flex:none;height:calc(4.9em + 24px)}
input.own,.ta.own{flex:none;height:auto;min-height:0;align-items:center;padding:10px 8px;font-size:11.8px}
.ta{display:flex;align-items:flex-start;justify-content:center;white-space:pre-wrap;overflow-wrap:anywhere}
.save{background:var(--head);color:#fff;margin-top:6px}
.save[hidden]{display:none}
::placeholder{color:var(--muted);opacity:1}
.foot{text-align:center;margin-top:18px}
.back{background:none;border:0;color:var(--title);font:700 14px "Noto Sans KR",sans-serif;cursor:pointer;text-decoration:underline}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<section id="intro" class="screen on">
  <h1>2026 잏링 결산</h1>
  <button class="go" id="enter" type="button">다음 화면으로 넘어가기</button>
</section>

<section id="main" class="screen">
  <div class="wrap">
    <h2 class="top">2026 LHRW 연말 결산</h2>
    <div id="rows"></div>
    <div class="foot"><button class="go save" id="save" type="button">이미지로 저장</button><br><br><button class="back" id="back" type="button">처음 화면으로</button></div>
  </div>
</section>

<script>
const P = (t)=>({t, k:'photo'});
const rows = [
  [P('올해의 연하 모에화'), P('올해의 연상 모에화'), P('올해의 잏링 모에화')],
  [P('올해의 투샷'), P('올해의 셀카')],
  [P('올해의 떡밥'), {t:'올해의 2차 연성', sub:'(작품 주인 기재)', k:'work'}],
  [{t:'올해 잏링에게 어울리는 노래', k:'text', ph:'노래 제목 – 아티스트'}, {t:'올해의 한마디', k:'text', ph:'글을 써 주세요'}]
];
const host = document.getElementById('rows');
rows.forEach(r=>{
  const row = document.createElement('div');
  row.className = 'row r'+r.length;
  r.forEach(c=>{
    const d = document.createElement('div'); d.className='card';
    let h = '<h3>'+c.t+(c.sub?' <small>'+c.sub+'</small>':'')+'</h3><div class="body">';
    if(c.k==='photo'){
      h += '<label class="slot"><input type="file" accept="image/*" aria-label="'+c.t+' 사진"><span class="ph">눌러서<br>사진 고르기</span><button type="button" class="rm" aria-label="사진 삭제">×</button></label>';
    } else if(c.k==='work'){
      h += '<textarea class="fill" placeholder="글을 써 주세요"></textarea><input class="own" type="text" placeholder="작품 주인 입력">';
    } else {
      h += '<textarea class="short" placeholder="'+c.ph+'"></textarea>';
    }
    h += '</div>';
    d.innerHTML = h; row.appendChild(d);
  });
  host.appendChild(row);
});
host.querySelectorAll('.slot').forEach(slot=>{
  const input = slot.querySelector('input'), rm = slot.querySelector('.rm');
  input.addEventListener('change', ()=>{
    const f = input.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = e=>{
      let pic = slot.querySelector('.pic');
      if(!pic){ pic = document.createElement('div'); pic.className='pic'; slot.appendChild(pic); }
      pic.style.backgroundImage = 'url('+e.target.result+')'; slot.classList.add('has');
    };
    fr.readAsDataURL(f);
  });
  rm.addEventListener('click', e=>{
    e.preventDefault(); e.stopPropagation();
    const pic = slot.querySelector('.pic'); if(pic) pic.remove();
    input.value=''; slot.classList.remove('has');
  });
});
const intro=document.getElementById('intro'), main=document.getElementById('main');
function show(w){intro.classList.toggle('on',w==='intro');main.classList.toggle('on',w==='main');window.scrollTo(0,0)}
document.getElementById('enter').addEventListener('click',()=>show('main'));
document.getElementById('back').addEventListener('click',()=>show('intro'));

const saveBtn=document.getElementById('save'); saveBtn.hidden=false;
let dl=null;
async function getDl(){ if(dl) return dl; try{ dl = window.claude ? await claude.use('downloads') : null; }catch(e){ dl=null; } return dl; }
getDl();
function showImage(url){
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(15,30,50,.88);display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;overflow:auto';
  const p=document.createElement('p'); p.textContent='이미지를 길게 눌러 저장해 주세요'; p.style.cssText='color:#fff;margin:4px 0;font:700 15px "Noto Sans KR",sans-serif;text-align:center';
  const im=document.createElement('img'); im.src=url; im.alt='2026 LHRW 연말 결산'; im.style.cssText='width:100%;max-width:393px;height:auto;border-radius:12px';
  const c=document.createElement('button'); c.type='button'; c.className='go'; c.textContent='닫기'; c.onclick=()=>o.remove();
  o.append(p,im,c); document.body.appendChild(o);
}
saveBtn.addEventListener('click', async()=>{
  const label='이미지로 저장';
  if(!window.html2canvas){ saveBtn.textContent='이미지 도구를 불러오지 못했어요'; setTimeout(()=>{saveBtn.textContent=label},2600); return; }
  const node=document.querySelector('#main .wrap');
  saveBtn.disabled=true; saveBtn.textContent='만드는 중…';
  try{
    const scale=Math.max(2,Math.min(4,1200/node.offsetWidth));
    const canvas=await html2canvas(node,{scale,backgroundColor:getComputedStyle(document.body).backgroundColor,useCORS:true,
      onclone:d=>{
        d.querySelectorAll('.rm,.ph,.foot').forEach(x=>x.remove());
        d.querySelectorAll('textarea,input.own').forEach(el=>{
          const x=d.createElement('div'); x.className='ta '+el.className; x.textContent=el.value; el.replaceWith(x);
        });
      }});
    const d=await getDl(); let handled=false;
    if(d){
      const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
      try{ await d.save({filename:'2026-LHRW-연말결산.png',data:blob}); handled=true; }
      catch(e){ if(e&&e.code==='declined') handled=true; }
    }
    if(!handled) showImage(canvas.toDataURL('image/png'));
  }catch(e){ saveBtn.textContent='저장하지 못했어요. 다시 눌러 주세요'; setTimeout(()=>{saveBtn.textContent=label},2600); saveBtn.disabled=false; return; }
  saveBtn.disabled=false; saveBtn.textContent=label;
});
</script>
